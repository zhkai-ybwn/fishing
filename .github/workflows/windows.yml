name: Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.90.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare pinned model and font assets
        run: ./packaging/Prepare-Assets.ps1

      - name: Check lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Prepare inference runtime
        run: |
          $runtime = & ./packaging/Get-OnnxRuntime.ps1
          "ORT_DYLIB_PATH=$(Join-Path $runtime 'onnxruntime.dll')" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release application
        run: cargo build --release --package boss-sensor --locked

      - name: Resolve installer version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $application = ($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'boss-sensor'
          if (!$application) { throw 'Could not resolve the BossSensor package version.' }
          $version = $application.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match the package version v$version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSI and EXE
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          BOSS_SENSOR_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path ./target/wix-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix = (Resolve-Path -LiteralPath ./target/wix-tools/wix.exe).Path
          & $wix extension add -g WixToolset.BootstrapperApplications.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/Build-Installers.ps1 -Version $env:BOSS_SENSOR_VERSION -Wix $wix -OutputDirectory ./target/distribution

      - name: Smoke-test both installers
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          BOSS_SENSOR_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/Test-Installers.ps1 -Version $env:BOSS_SENSOR_VERSION -InstallerDirectory ./target/distribution

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: BossSensor-windows-x64
          path: target/distribution/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BossSensor-windows-x64
          path: distribution

      - name: Verify and publish installers
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "BossSensor $GITHUB_REF_NAME" ./*.exe ./*.msi SHA256SUMS.txt
