[package]
name = "boss-sensor-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "=0.10.11", features = ["input-msmf"] }
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
